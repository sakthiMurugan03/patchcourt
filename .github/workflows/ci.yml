name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx redis
          # langchain-anthropic is an optional extra (pyproject [llm]) but is
          # required by tests/test_llm_providers.py::test_claude_backend_selected.
          pip install "langchain-anthropic>=0.2"

      - name: Run tests
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchcourt_test
        run: pytest

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
