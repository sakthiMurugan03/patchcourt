name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    env:
      # Point settings at local, unused services so imports/tests load cleanly
      # on headless runners without a live Redis or Postgres instance.
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchcourt_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure test dependencies
        run: pip install pytest-cov pytest-asyncio httpx redis

      - name: Run tests with coverage
        run: pytest --cov=patchcourt

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./dashboard/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
