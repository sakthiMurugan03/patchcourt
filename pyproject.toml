[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchcourt"
version = "0.1.0"
description = "Multi-agent, evidence-tiered AI code-review system for GitHub Pull Requests"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
llm = [
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=1.0",
]
rag = [
    "sentence-transformers>=3.0",
]

[project.scripts]
patchcourt = "patchcourt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
