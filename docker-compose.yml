name: patchcourt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patchcourt
      POSTGRES_PASSWORD: patchcourt
      POSTGRES_DB: patchcourt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchcourt"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build: .
    image: patchcourt-api:latest
    ports:
      - "8000:8000"
    environment: &patchcourt_env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: patchcourt_chunks
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://patchcourt:patchcourt@postgres:5432/patchcourt
      SANDBOX_ENABLED: "1"
      SANDBOX_IMAGE: patchcourt-sandbox:latest
      SANDBOX_WORKSPACE: /workspace
      SANDBOX_WORKDIR: ${SBX_HOST_DIR:-$PWD/.sandbox}
      SONAR_URL: ${SONAR_URL:-http://host.docker.internal:9000}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_COMPONENT: ${SONAR_COMPONENT:-patchcourt}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SBX_HOST_DIR:-$PWD/.sandbox}:${SBX_HOST_DIR:-$PWD/.sandbox}
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: .
    image: patchcourt-api:latest
    command: ["celery", "-A", "patchcourt.worker", "worker", "--loglevel=info"]
    environment:
      <<: *patchcourt_env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SBX_HOST_DIR:-$PWD/.sandbox}:${SBX_HOST_DIR:-$PWD/.sandbox}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    profiles: ["worker"]

  dashboard:
    build:
      context: ./dashboard
    image: patchcourt-dashboard:latest
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    profiles: ["dashboard"]

  sandbox:
    image: patchcourt-sandbox:latest
    build:
      context: ./sandbox
    profiles: ["tools"]
    command: ["true"]  # build-only helper — run `docker compose build sandbox`

volumes:
  pgdata:
  redisdata:
  qdrantdata:
